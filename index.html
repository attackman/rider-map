<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b5fff" />
  <title>Rider Map SG</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@^6.15.0/dist/maplibre-gl.css" />
  <style>
    html, body { margin: 0; height: 100%; }
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    #map { position: fixed; inset: 0; }
    .bar {
      position: fixed; left: 12px; right: 12px;
      top: calc(env(safe-area-inset-top, 0px) + 12px);
      background: #fff; color: #111; border-radius: 12px;
      padding: 12px 14px; font-size: 16px; font-weight: 600;
      box-shadow: 0 2px 10px rgba(0,0,0,.25); z-index: 5;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="bar">Rider Map SG</div>

  <script type="module">
    import * as maplibregl from 'https://unpkg.com/maplibre-gl@^6.15.0/dist/maplibre-gl.mjs';

    // Centre of Singapore (longitude, latitude)
    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://tiles.openfreemap.org/styles/liberty',
      center: [103.8198, 1.3521],
      zoom: 11.2,
      maxBounds: [[103.55, 1.12], [104.15, 1.50]]
    });

    map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'bottom-right');
  </script>
</body>
</html>
