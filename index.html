    // ---------- saved and recent places (kept on this phone only) ----------
    let savedPlaces = Array.isArray(loadJson('saved', [])) ? loadJson('saved', []) : [];
    let recentPlaces = Array.isArray(loadJson('recent', [])) ? loadJson('recent', []) : [];

    function samePlace(a, b) {
      return a.name === b.name && Math.abs(a.lat - b.lat) < 1e-4 && Math.abs(a.lng - b.lng) < 1e-4;
    }
    function slim(p) {
      return { name: p.name, address: p.address || '', category: p.category || null, lat: p.lat, lng: p.lng };
    }
    function isSaved(p) { return savedPlaces.some((s) => samePlace(s, p)); }

    function toggleSaved(p) {
      if (isSaved(p)) {
        savedPlaces = savedPlaces.filter((s) => !samePlace(s, p));
      } else {
        savedPlaces = [slim(p), ...savedPlaces].slice(0, 30);
      }
      saveJson('saved', savedPlaces);
      return isSaved(p);
    }

    function remember(p) {
      if (!p || p.name === 'My location') return;
      recentPlaces = [slim(p), ...recentPlaces.filter((r) => !samePlace(r, p))].slice(0, 10);
      saveJson('recent', recentPlaces);
    }

    // Tapping the empty search box shows saved places, then recent ones
    function showQuickList() {
      if (input.value.trim()) return;
      list.innerHTML = '';
      const addGroup = (title, items, mark) => {
        if (!items.length) return;
        list.appendChild(el('li', 'section', title));
        for (const r of items) {
          const li = el('li');
          const name = el('div', 'name');
          name.append(el('span', 'mark', mark), document.createTextNode(r.name));
          li.append(name, el('div', 'addr', r.address || ''));
          li.addEventListener('click', () => choose(r));
          list.appendChild(li);
        }
      };
      addGroup('Saved', savedPlaces, '★');
      addGroup('Recent', recentPlaces.filter((r) => !isSaved(r)), '🕘');
      list.dataset.quick = list.childElementCount ? '1' : '';
    }

    input.addEventListener('focus', showQuickList);
    input.addEventListener('blur', () => {
      setTimeout(() => {
        if (list.dataset.quick && document.activeElement !== input) { list.innerHTML = ''; list.dataset.quick = ''; }
      }, 300);
    });

    function setPoint(which, place) {
      if (!place) return;
      if (pickedMarker) { pickedMarker.remove(); pickedMarker = null; }
      picked = null;
      // Mid-ride: a new start ends the ride; a new destination reroutes from where the rider is
      if (riding && which === 'start') stopRide();
      const lngLat = [place.lng, place.lat];
      if (riding && which === 'end' && lastFix) {
        end = place;
        if (endMarker) endMarker.remove();
        endMarker = new maplibregl.Marker({ color: END_COLOUR }).setLngLat(lngLat).addTo(map);
        rerouteFromHere();
        return;
      }
      if (which === 'start') {
        start = place;
        if (startMarker) startMarker.remove();
        startMarker = new maplibregl.Marker({ color: START_COLOUR }).setLngLat(lngLat).addTo(map);
      } else {
        end = place;
        if (endMarker) endMarker.remove();
        endMarker = new maplibregl.Marker({ color: END_COLOUR }).setLngLat(lngLat).addTo(map);
      }
      if (start && end) {
        getRoute();
      } else {
        if (!end) map.flyTo({ center: lngLat, zoom: 15 });
        showTrip();
      }
    }

    // ---------- my location ----------
    function useMyLocation() {
      if (!('geolocation' in navigator)) {
        showTrip([el('div', 'error', 'This browser cannot share your location.')]);
        return;
      }
      // The blue dot already knows where you are: use it straight away
      if (lastKnown && Date.now() - lastKnown.time < 20000 && lastKnown.accuracy <= 100) {
        setPoint('start', { name: 'My location', address: '', lat: lastKnown.lat, lng: lastKnown.lng });
        return;
      }
      showTrip([el('div', 'sub', 'Finding your location…')]);
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;
          if (!inSingapore(lat, lng)) {
            showTrip([el('div', 'error', 'Your location seems to be outside Singapore.')]);
            return;
          }
          gotLocation(pos);
          setPoint('start', { name: 'My location', address: '', lat, lng });
        },
        (err) => {
          const msg = err.code === 1
            ? 'Location is blocked. Allow location for this site in your browser settings, then try again.'
            : 'Could not get your location. Check that location is on, then try again.';
          showTrip([el('div', 'error', msg)]);
        },
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 10000 }
      );
    }

    // ---------- the blue dot: always shows where you are once location is allowed ----------
    function noteKnown(c) {
      const moving = (c.speed || 0) > 0.8 && c.heading != null && !Number.isNaN(c.heading);
      lastKnown = { lat: c.latitude, lng: c.longitude, accuracy: c.accuracy || 0,
                    heading: moving ? c.heading : null, time: Date.now() };
    }

    function meEl() {
      return meMarker && typeof meMarker.getElement === 'function' ? meMarker.getElement() : null;
    }

    function placeMe(lngLat) {
      if (!meMarker) meMarker = makeMeMarker().setLngLat(lngLat).addTo(map);
      else meMarker.setLngLat(lngLat);
      const dotEl = meEl();
      if (dotEl) dotEl.classList.toggle('riding', riding);
      updateArrow();
    }

    // Any successful location: remember it, show the dot, keep it updated from now on
    function gotLocation(pos) {
      const c = pos.coords;
      if (!inSingapore(c.latitude, c.longitude)) return;
      locationAllowed = true;
      noteKnown(c);
      if (!riding) placeMe([c.longitude, c.latitude]);
      startIdleWatch();
    }

    function startIdleWatch() {
      if (idleWatchId != null || riding || !('geolocation' in navigator) || document.visibilityState !== 'visible') return;
      idleWatchId = navigator.geolocation.watchPosition((pos) => {
        const c = pos.coords;
        if (!inSingapore(c.latitude, c.longitude)) return;
        locationAllowed = true;
        noteKnown(c);
        if (!riding) placeMe([c.longitude, c.latitude]);
      }, () => {}, { enableHighAccuracy: !rideSettings.batterySaver, maximumAge: 5000, timeout: 30000 });
      startCompass();
    }

    function stopIdleWatch() {
      if (idleWatchId != null) navigator.geolocation.clearWatch(idleWatchId);
      idleWatchId = null;
    }

    // Save battery: stop watching while the app is in the background
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') { if (locationAllowed && !riding) startIdleWatch(); }
      else if (!riding) stopIdleWatch();
    });

    // If location was allowed before, show the dot as soon as the app opens (no pop-up)
    (async () => {
      try {
        if (!navigator.permissions || !navigator.permissions.query) return;
        const status = await navigator.permissions.query({ name: 'geolocation' });
        if (status.state === 'granted') { locationAllowed = true; startIdleWatch(); }
        status.onchange = () => { if (status.state === 'granted') { locationAllowed = true; startIdleWatch(); } };
      } catch (e) { /* the dot appears after the first location instead */ }
    })();

    // Which way the phone is facing, for the cone around the dot
    let compassStarted = false, lastCompassPaint = 0;
    function setCompass(h) {
      if (h == null || Number.isNaN(h)) return;
      compassHeading = (h + 360) % 360;
      if (Date.now() - lastCompassPaint > 150) { lastCompassPaint = Date.now(); updateArrow(); }
    }
    function startCompass() {
      if (compassStarted) return;
      compassStarted = true;
      if ('ondeviceorientationabsolute' in window) {
        window.addEventListener('deviceorientationabsolute', (e) => { if (e.alpha != null) setCompass(360 - e.alpha); });
      } else {
        window.addEventListener('deviceorientation', (e) => { if (e.webkitCompassHeading != null) setCompass(e.webkitCompassHeading); });
      }
    }
    // iPhones ask permission for the compass, and only from a tap
    function askCompassPermission() {
      try {
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
          DeviceOrientationEvent.requestPermission().then(startCompass).catch(() => {});
        }
      } catch (e) { /* no compass: the dot still shows */ }
    }

    // Top-bar button: fly to where you are
    meBtn.addEventListener('click', () => {
      askCompassPermission();
      track('show_me');
      if (lastKnown && Date.now() - lastKnown.time < 60000) {
        map.flyTo({ center: [lastKnown.lng, lastKnown.lat], zoom: Math.max(map.getZoom(), 16) });
        return;
      }
      if (!('geolocation' in navigator)) { showToast('This browser cannot share your location'); return; }
      showToast('Finding you…');
      navigator.geolocation.getCurrentPosition((pos) => {
        const c = pos.coords;
        if (!inSingapore(c.latitude, c.longitude)) { showToast('You seem to be outside Singapore'); return; }
        gotLocation(pos);
        map.flyTo({ center: [c.longitude, c.latitude], zoom: Math.max(map.getZoom(), 16) });
      }, (err) => {
        showToast(err.code === 1 ? 'Location is blocked. Allow it in your browser settings.' : 'Could not find your location');
      }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 10000 });
    });

    // ---------- trip card ----------
    function tripLine(colour, label, place) {
      const line = el('div');
      const dot = el('span', 'dot');
      dot.style.background = colour;
      line.append(dot, document.createTextNode(label + ': ' + (place ? place.name : 'search for a place')));
      return line;
    }

    function modeSwitch() {
      const wrap = el('div', 'modes');
      for (const key of Object.keys(MODES)) {
        const b = el('button', key === mode ? 'on' : '', MODES[key].label);
        b.type = 'button';
        b.addEventListener('click', () => setMode(key));
        wrap.appendChild(b);
      }
      return wrap;
    }

    function setMode(key) {
      if (key === mode) return;
      mode = key;
      save('mode', mode);
      if (map.getLayer('route-line')) map.setPaintProperty('route-line', 'line-color', lineColour());
      if (riding && lastFix) { rerouteFromHere(); return; }
      if (start && end) getRoute(); else showTrip();
    }

    function showTrip(extra = []) {
      const trip = el('div', 'trip');
      trip.append(tripLine(START_COLOUR, 'From', start), tripLine(END_COLOUR, 'To', end));

      const row = el('div', 'row');
      if (lastRoute) {
        const go = el('button', 'btn-go', '▶ Start ride');
        go.addEventListener('click', startRide);
        row.append(go);
      } else if (!start || start.name !== 'My location') {
        const me = el('button', 'btn-me', 'Start from my location');
        me.addEventListener('click', useMyLocation);
        row.append(me);
      }
      const clear = el('button', 'btn-clear', 'Clear');
      clear.addEventListener('click', clearRoute);
      row.append(clear);

      showCard([modeSwitch(), trip, ...extra, el('div', 'wake'), row]);
      updateWakeNote();
    }

    function clearRoute() {
      stopRide();
      routeRequest++;
      shownCoords = null;
      start = end = picked = lastRoute = null;
      [startMarker, endMarker, pickedMarker].forEach((m) => m && m.remove());
      startMarker = endMarker = pickedMarker = null;
      drawRoute();
      letScreenSleep();
      hideCard();
    }

    // ---------- routing ----------
    async function getRoute() {
      const myRequest = ++routeRequest;
      const m = MODES[mode];
      if (riding) showRideCard([el('div', 'sub', 'Rerouting from where you are…')]);
      else showTrip([el('div', 'sub', 'Finding a route ' + m.words + '…')]);
      const url = '/api/route?type=' + mode
        + '&start=' + start.lat + ',' + start.lng
        + '&end=' + end.lat + ',' + end.lng;
      try {
        const data = await getJson(url);
        if (myRequest !== routeRequest) return; // user changed something meanwhile

        lastRoute = data;
        shownCoords = null;
        routeGeo = measureRoute(data.coordinates);
        navSteps = buildSteps(data);
        drawRoute();
        keepScreenOn();

        if (riding) {
          // Mid-ride: keep the map on the rider instead of zooming out to the whole route
          if (lastFix) updateProgress(lastFix);
          showRideCard();
          return;
        }

        const bounds = data.coordinates.reduce(
          (b, c) => b.extend(c), new maplibregl.LngLatBounds(data.coordinates[0], data.coordinates[0]));
        const topSpace = document.querySelector('.search').offsetHeight + 30;
        map.fitBounds(bounds, { padding: { top: topSpace, bottom: 340, left: 40, right: 60 }, maxZoom: 17 });

        const summary = el('div', 'summary');
        summary.append(
          document.createTextNode(formatDistance(data.distance_m)),
          el('small', null, '  ·  ' + formatTime(data.time_s) + ' ' + m.words));
        showTrip([summary, etaButton(data.time_s || 0)]);
        track('route_' + mode);
        noteRouteDone();
      } catch (e) {
        if (myRequest !== routeRequest) return;
        if (riding) {
          // Keep riding on the old route; try again on the next GPS update
          showRideCard([el('div', 'error', 'Could not reroute: ' + e.message)]);
          return;
        }
        lastRoute = null;
        routeGeo = null;
        drawRoute();
        letScreenSleep();
        showTrip([el('div', 'error', 'Route problem: ' + e.message)]);
      }
    }

    // ---------- route maths (flat-earth metres: accurate enough inside Singapore) ----------
    const M_PER_DEG_LAT = 110574;
    const M_PER_DEG_LNG = 111320 * Math.cos(1.35 * Math.PI / 180);
    function toXY(c) { return [c[0] * M_PER_DEG_LNG, c[1] * M_PER_DEG_LAT]; }

    function measureRoute(coords) {
      const pts = coords.map(toXY);
      const cum = [0];
      for (let i = 1; i < pts.length; i++) {
        cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
      }
      return { coords, pts, cum, total: cum[cum.length - 1] };
    }

    // Nearest point on the route to the rider: how far off it they are, and how much is left
    function snapToRoute(lng, lat) {
      const g = routeGeo;
      const p = toXY([lng, lat]);
      let best = { dist: Infinity, i: 0, t: 0 };
      for (let i = 0; i < g.pts.length - 1; i++) {
        const [ax, ay] = g.pts[i], [bx, by] = g.pts[i + 1];
        const dx = bx - ax, dy = by - ay;
        const len2 = dx * dx + dy * dy;
        const t = len2 ? Math.max(0, Math.min(1, ((p[0] - ax) * dx + (p[1] - ay) * dy) / len2)) : 0;
        const d = Math.hypot(p[0] - (ax + t * dx), p[1] - (ay + t * dy));
        if (d < best.dist) best = { dist: d, i, t };
      }
      const segLen = g.cum[best.i + 1] - g.cum[best.i];
      const along = g.cum[best.i] + segLen * best.t;
      const a = g.coords[best.i], b = g.coords[best.i + 1] || a;
      const snapped = [a[0] + (b[0] - a[0]) * best.t, a[1] + (b[1] - a[1]) * best.t];
      return {
        offRoute_m: best.dist,
        remaining_m: Math.max(0, g.total - along),
        ahead: [snapped, ...g.coords.slice(best.i + 1)]
      };
    }

    function metresBetween(a, b) {
      const p = toXY(a), q = toXY(b);
      return Math.hypot(p[0] - q[0], p[1] - q[1]);
    }

    // ---------- spoken turn-by-turn directions ----------
    let navSteps = [];
    let voiceOn = load('voice', ['on', 'off'], 'on') === 'on';

    // How early to warn about a turn (metres), and when to say "turn now"
    const ANNOUNCE = { drive: { far: 300, near: 60 }, cycle: { far: 150, near: 30 }, walk: { far: 80, near: 20 } };
    const SPOKEN_TURNS = ['left', 'right', 'slight_left', 'slight_right', 'sharp_left', 'sharp_right', 'uturn', 'roundabout'];
    const TURN_ANGLE = { straight: 0, depart: 0, roundabout: 0, arrive: 0, slight_right: 45, right: 90,
                         sharp_right: 135, uturn: 180, slight_left: -45, left: -90, sharp_left: -135 };
    const EXPRESSWAYS = ['PIE', 'AYE', 'CTE', 'ECP', 'KJE', 'BKE', 'SLE', 'TPE', 'KPE', 'MCE', 'NSC'];
    const ABBREVIATIONS = {
      AVE: 'Avenue', ST: 'Street', RD: 'Road', DR: 'Drive', CRES: 'Crescent', CTRL: 'Central',
      NTH: 'North', STH: 'South', BT: 'Bukit', JLN: 'Jalan', LOR: 'Lorong', UPP: 'Upper', LWR: 'Lower',
      PL: 'Place', CL: 'Close', TER: 'Terrace', BLVD: 'Boulevard', EXPY: 'Expressway', PKWY: 'Parkway',
      HWY: 'Highway', HTS: 'Heights', GDN: 'Garden', GDNS: 'Gardens', PK: 'Park', SQ: 'Square',
      LK: 'Link', MT: 'Mount', KG: 'Kampong', TG: 'Tanjong', BLK: 'Block'
    };

    // Short forms that stay in capitals
    const ACRONYMS = ['MRT', 'LRT', 'HDB', 'NTUC', 'SAFRA', 'NUS', 'NTU', 'SMU', 'SIT', 'SUTD', 'SUSS', 'ITE', 'CC',
                      'RC', 'JTC', 'PUB', 'NEA', 'LTA', 'URA', 'SGH', 'KKH', 'TTSH', 'NUH', 'CGH', 'SKH', 'KTPH', 'IMH',
                      'YMCA', 'YWCA', 'ICA', 'MOE', 'CPF', 'IRAS', 'NLB', 'UOB', 'OCBC', 'DBS', 'POSB', 'ATM', 'PCN', 'SG', 'HVP', 'FC'];

    // "BEDOK NTH AVE 1" -> "Bedok North Avenue 1"
    function niceStreet(s) {
      if (!s) return '';
      return String(s).trim().split(/\s+/).map((w) => {
        const up = w.toUpperCase().replace(/\.$/, '');
        if (EXPRESSWAYS.includes(up) || ACRONYMS.includes(up.replace(/[^A-Z]/g, ''))) return w.toUpperCase();
        if (ABBREVIATIONS[up]) return ABBREVIATIONS[up];
        if (/\d/.test(w)) return up;
        return w.charAt(0).toUpperCase() + w.slice(1).toLowerCase();
      }).join(' ');
    }

    function classifyTurn(step) {
      const s = String(step.text || step.turn || '').toLowerCase().replace(/-/g, ' ');
      if (/arriv|destination/.test(s)) return 'arrive';
      if (/u turn|uturn|make a u/.test(s)) return 'uturn';
      if (/roundabout|rotary/.test(s)) return 'roundabout';
      if (/^head\b|\bdepart/.test(s)) return 'depart';
      const side = /\bleft\b/.test(s) ? 'left' : /\bright\b/.test(s) ? 'right' : null;
      if (side) {
        if (/sharp/.test(s)) return 'sharp_' + side;
        if (/slight|bear|keep/.test(s)) return 'slight_' + side;
        return side;
      }
      return 'straight';
    }

    function phraseFor(kind, street) {
      const onto = street ? ' onto ' + street : '';
      switch (kind) {
        case 'left': return 'Turn left' + onto;
        case 'right': return 'Turn right' + onto;
        case 'slight_left': return 'Keep left' + onto;
        case 'slight_right': return 'Keep right' + onto;
        case 'sharp_left': return 'Make a sharp left' + onto;
        case 'sharp_right': return 'Make a sharp right' + onto;
        case 'uturn': return 'Make a U-turn' + onto;
        case 'roundabout': return 'At the roundabout, continue' + onto;
        case 'arrive': return 'Arrive at your destination';
        case 'depart': return 'Head off' + (street ? ' on ' + street : '');
        default: return 'Continue' + onto;
      }
    }

    // Steps from OneMap, each placed at its distance along the route
    function buildSteps(data) {
      if (!routeGeo || routeGeo.total <= 0 || routeGeo.pts.length < 2) return [];
      let steps = (data.steps || []).map((s) => {
        const kind = classifyTurn(s);
        const street = niceStreet(s.street);
        let phrase = phraseFor(kind, street);
        const head = /^head\s+(.+?)(\s+on\s+|$)/i.exec(s.text || '');
        if (kind === 'depart' && head) phrase = 'Head ' + head[1].toLowerCase() + (street ? ' on ' + street : '');
        return { kind, street, phrase, along: routeGeo.total - snapToRoute(s.lng, s.lat).remaining_m };
      });
      // No usable turns from OneMap: work them out from the shape of the route instead
      if (!steps.some((s) => SPOKEN_TURNS.includes(s.kind))) steps = steps.concat(turnsFromShape());
      return steps.sort((a, b) => a.along - b.along);
    }

    function turnsFromShape() {
      const g = routeGeo, out = [];
      const pointAt = (d) => {
        d = Math.max(0, Math.min(g.total, d));
        let i = 0;
        while (i < g.cum.length - 2 && g.cum[i + 1] < d) i++;
        const seg = (g.cum[i + 1] - g.cum[i]) || 1, t = (d - g.cum[i]) / seg;
        return [g.pts[i][0] + (g.pts[i + 1][0] - g.pts[i][0]) * t, g.pts[i][1] + (g.pts[i + 1][1] - g.pts[i][1]) * t];
      };
      const bearing = (a, b) => Math.atan2(b[0] - a[0], b[1] - a[1]) * 180 / Math.PI;
      let lastTurn = -Infinity;
      for (let i = 1; i < g.pts.length - 1; i++) {
        const d = g.cum[i];
        if (d < 20 || d > g.total - 20 || d - lastTurn < 40) continue;
        const delta = ((bearing(pointAt(d), pointAt(d + 20)) - bearing(pointAt(d - 20), pointAt(d)) + 540) % 360) - 180;
        const a = Math.abs(delta);
        if (a < 40) continue;
        const side = delta > 0 ? 'right' : 'left';
        const kind = a > 150 ? 'uturn' : a > 120 ? 'sharp_' + side : a < 60 ? 'slight_' + side : side;
        out.push({ kind, street: '', phrase: phraseFor(kind, ''), along: d });
        lastTurn = d;
      }
      return out;
    }

    function nextTurn() {
      if (!progress || !routeGeo || !navSteps.length) return null;
      const here = routeGeo.total - progress.remaining_m;
      const step = navSteps.find((s) => SPOKEN_TURNS.includes(s.kind) && s.along > here + 3);
      return step ? { step, dist: step.along - here } : null;
    }

    function spokenDistance(m) {
      if (m < 200) return Math.max(10, Math.round(m / 10) * 10) + ' metres';
      if (m < 1000) return Math.round(m / 50) * 50 + ' metres';
      return (m / 1000).toFixed(1) + ' kilometres';
    }

    function lowerFirst(s) { return s.charAt(0).toLowerCase() + s.slice(1); }

    function speak(text) {
      if (!voiceOn || !text || !('speechSynthesis' in window)) return;
      try {
        const synth = window.speechSynthesis;
        synth.cancel(); // say the newest instruction, never a backlog
        // Expressway names are read letter by letter: "P I E"
        const words = text.replace(new RegExp('\\b(' + EXPRESSWAYS.join('|') + ')\\b', 'g'), (x) => x.split('').join(' '));
        const u = new SpeechSynthesisUtterance(words);
        const voices = synth.getVoices();
        const v = voices.find((x) => /^en[-_]SG/i.test(x.lang)) || voices.find((x) => /^en[-_]GB/i.test(x.lang))
          || voices.find((x) => /^en/i.test(x.lang));
        if (v) u.voice = v;
        u.lang = v ? v.lang : 'en-GB';
        synth.speak(u);
      } catch (e) { /* no voice on this phone: the on-screen banner still shows the turn */ }
    }

    function stopSpeaking() {
      try { if ('speechSynthesis' in window) window.speechSynthesis.cancel(); } catch (e) { /* ignore */ }
    }

    // Called on every GPS update while riding
    function announceTurns() {
      if (!progress || progress.offRoute_m > 50) return;
      const n = nextTurn();
      if (!n) return;
      const t = ANNOUNCE[mode];
      if (n.dist <= t.near) {
        if (!n.step.saidNear) { n.step.saidNear = n.step.saidFar = true; speak(n.step.phrase); }
      } else if (n.dist <= t.far && !n.step.saidFar) {
        n.step.saidFar = true;
        speak('In ' + spokenDistance(n.dist) + ', ' + lowerFirst(n.step.phrase));
      }
    }

    function toggleVoice() {
      voiceOn = !voiceOn;
      save('voice', voiceOn ? 'on' : 'off');
      if (voiceOn) speak('Voice on'); else stopSpeaking();
      showRideCard();
    }

    const ARROW_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20V5M5 11l7-7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

    // Big "next turn" banner at the top of the ride card
    const SEARCH_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.6-4.6"/></svg>';
    function nextTurnBanner() {
      const n = nextTurn();
      const box = el('div', 'next');
      const icon = el('div', 'next-icon');
      icon.innerHTML = ARROW_SVG; // fixed icon, no user text
      const kind = n ? n.step.kind : 'straight';
      icon.style.transform = 'rotate(' + (TURN_ANGLE[kind] || 0) + 'deg)';
      const words = el('div', 'next-words');
      words.append(el('div', 'next-what', n ? n.step.phrase : 'Continue to your destination'));
      if (n) words.append(el('div', 'next-dist', formatDistance(Math.max(10, Math.round(n.dist / 10) * 10))));
      // Search for a new destination mid-ride
      const find = el('button', 'next-search');
      find.type = 'button';
      find.setAttribute('aria-label', 'Search for a new destination');
      find.innerHTML = SEARCH_SVG; // fixed icon, no user text
      find.addEventListener('click', () => { document.body.classList.add('ride-search'); input.focus(); });
      box.append(icon, words, find);
      return box;
    }

    // ---------- live ride tracking ----------
    const CONE_SVG = '<svg viewBox="0 0 60 60" aria-hidden="true"><defs><radialGradient id="meCone" cx="30" cy="30" r="30" gradientUnits="userSpaceOnUse"><stop offset="0.2" stop-color="#007aff" stop-opacity=".5"/><stop offset="1" stop-color="#007aff" stop-opacity="0"/></radialGradient></defs><path d="M30 30 13 3.5a30 30 0 0 1 34 0z" fill="url(#meCone)"/></svg>';
    function makeMeMarker() {
      const wrap = el('div', 'me');
      const rot = el('div', 'me-rot');
      const cone = el('div', 'me-cone');
      cone.innerHTML = CONE_SVG; // fixed drawing, no user text
      rot.append(cone, el('div', 'me-arrow'));
      wrap.append(rot, el('div', 'me-dot'));
      return new maplibregl.Marker({ element: wrap });
    }

    function startRide() {
      if (!lastRoute || riding) return;
      if (!('geolocation' in navigator)) {
        showTrip([el('div', 'error', 'This browser cannot share your location.')]);
        return;
      }
      riding = true;
      following = true;
      offRouteCount = 0;
      lastRerouteAt = Date.now();
      progress = null;
      lastHeavy = 0;
      lastAutoZoom = null;
      stopIdleWatch();                          // the ride's own location updates take over
      document.body.classList.add('riding');
      if (meEl()) meEl().classList.add('riding');
      keepScreenOn();
      track('ride_start');
      setTimeout(checkAlerts, 6000);            // alerts are spoken, not shown, while riding
      showRideCard([el('div', 'sub', 'Waiting for GPS…')]);
      // Speaking straight from the tap also unlocks the voice on iPhones
      const first = navSteps.find((s) => s.kind === 'depart');
      speak('Starting ride. ' + (first ? first.phrase : ''));
      watchId = navigator.geolocation.watchPosition(onFix, onFixError,
        { enableHighAccuracy: true, maximumAge: 2000, timeout: 20000 });
    }

    function stopRide() {
      if (watchId != null) navigator.geolocation.clearWatch(watchId);
      watchId = null;
      const wasRiding = riding;
      riding = false;
      lastFix = null;
      progress = null;
      document.body.classList.remove('riding', 'ride-search');
      turnBox.hidden = true;
      turnBox.innerHTML = '';
      // Keep the blue dot (now with the facing cone) and go back to watching quietly
      if (meEl()) { meEl().classList.remove('riding'); updateArrow(); }
      if (wasRiding && locationAllowed) startIdleWatch();
      updateTop();
      // Back to north-up after a ride with "Map turns with me"
      if (typeof map.getBearing === 'function' && map.getBearing() !== 0) map.easeTo({ bearing: 0, duration: 400 });
    }

    function endRide() {
      stopRide();
      stopSpeaking();
      shownCoords = null;
      drawRoute();
      showTrip();
    }

    function onFix(pos) {
      if (!riding) return;
      const c = pos.coords;
      const here = [c.longitude, c.latitude];

      // Direction of travel: from the phone if it knows, otherwise from the last two fixes
      let heading = (c.heading != null && !Number.isNaN(c.heading) && (c.speed || 0) > 0.5) ? c.heading : null;
      if (heading == null && lastFix && metresBetween([lastFix.lng, lastFix.lat], here) > 5) {
        const p = toXY([lastFix.lng, lastFix.lat]), q = toXY(here);
        heading = (Math.atan2(q[0] - p[0], q[1] - p[1]) * 180 / Math.PI + 360) % 360;
      }
      if (heading == null && lastFix) heading = lastFix.heading;

      // Speed in km/h: from the phone if it knows, otherwise from the last two fixes
      let speedKmh = (c.speed != null && !Number.isNaN(c.speed)) ? c.speed * 3.6 : null;
      if (speedKmh == null && lastFix) {
        const secs = (Date.now() - lastFix.time) / 1000;
        if (secs > 0.5) speedKmh = metresBetween([lastFix.lng, lastFix.lat], here) / secs * 3.6;
      }
      lastFix = { lat: c.latitude, lng: c.longitude, accuracy: c.accuracy || 0, heading, speedKmh, time: Date.now() };
      lastKnown = { lat: lastFix.lat, lng: lastFix.lng, accuracy: lastFix.accuracy, heading, time: lastFix.time };
      locationAllowed = true;

      placeMe(here);

      // Battery saver: between turns, do the full update only every 4 seconds
      if (rideSettings.batterySaver && lastHeavy && Date.now() - lastHeavy < 4000) {
        const n = nextTurn();
        const nearSomething = (n && n.dist < 200) || metresBetween(here, [end.lng, end.lat]) < 300;
        if (!nearSomething) return;
      }
      lastHeavy = Date.now();

      // Arrived?
      if (metresBetween(here, [end.lng, end.lat]) < 35) { arrived(); return; }

      updateProgress(lastFix);
      if (progress && progress.offRoute_m <= 50 && progress.remaining_m < 25) { arrived(); return; }

      // Off the route for two updates in a row (and GPS is decent): get a new route from here
      const gpsOk = lastFix.accuracy <= 50;
      if (progress && gpsOk && progress.offRoute_m > 50) offRouteCount++;
      else offRouteCount = 0;
      if (offRouteCount >= 2 && Date.now() - lastRerouteAt > 15000) {
        rerouteFromHere();
        return;
      }

      announceTurns();

      if (following) map.easeTo(followView(here, heading, speedKmh));
      showRideCard();
    }

    // Where the map should look while following the rider
    function followView(here, heading, speedKmh) {
      const n = nextTurn();
      const toEnd = end ? metresBetween(here, [end.lng, end.lat]) : Infinity;
      return {
        center: here,
        zoom: rideSettings.autoZoom ? autoZoomLevel(speedKmh, n ? n.dist : Infinity, toEnd) : Math.max(map.getZoom(), 16),
        bearing: rideSettings.headingUp ? (heading != null ? heading : map.getBearing()) : 0,
        offset: [0, followOffsetY()],
        duration: rideSettings.batterySaver ? 0 : 800
      };
    }

    // Keep the rider in the open part of the map, between the turn banner and the bottom bar.
    // With "Map turns with me", sit a little lower so more of the road ahead shows.
    function followOffsetY() {
      const top = turnBox.hidden ? 0 : turnBox.offsetHeight + 8;
      const bottom = card.hidden ? 0 : card.offsetHeight + 8;
      const lower = rideSettings.headingUp ? Math.round(window.innerHeight * 0.12) : 0;
      return Math.round((top - bottom) / 2) + lower;
    }

    // Auto zoom: further out when moving fast, close in near turns and the destination
    function autoZoomLevel(kmh, toTurn, toEnd) {
      let z = kmh == null ? 16.8 : kmh < 12 ? 17.3 : kmh < 25 ? 16.8 : kmh < 45 ? 16.2 : kmh < 70 ? 15.6 : 15;
      const nearTurnOrEnd = toTurn < 150 || toEnd < 250;
      if (nearTurnOrEnd) z = Math.max(z, 17.2);   // always close in before a turn or the destination
      else if (lastAutoZoom != null && Math.abs(z - lastAutoZoom) < 0.5) z = lastAutoZoom; // otherwise, no jittery zooming
      lastAutoZoom = z;
      return z;
    }

    // The arrow shows the direction of travel on screen, allowing for how far the map is turned
    // Riding: direction of travel. Otherwise: the compass, or direction of travel if walking.
    function currentHeading() {
      if (riding) return lastFix ? lastFix.heading : null;
      if (compassHeading != null) return compassHeading;
      return lastKnown ? lastKnown.heading : null;
    }
    function updateArrow() {
      if (!meMarker) return;
      const dotEl = meEl();
      const rot = dotEl && dotEl.querySelector('.me-rot');
      if (!rot) return;
      const h = currentHeading();
      const bearing = typeof map.getBearing === 'function' ? map.getBearing() : 0;
      rot.style.transform = 'rotate(' + ((h || 0) - bearing) + 'deg)';
      rot.style.opacity = h == null ? '0' : '1';
    }
    map.on('rotate', updateArrow);

    function updateProgress(fix) {
      if (!routeGeo || routeGeo.pts.length < 2) return;
      const s = snapToRoute(fix.lng, fix.lat);
      progress = s;
      shownCoords = s.offRoute_m <= 50 ? s.ahead : null; // trim the line only when on it
      drawRoute();
    }

    function rerouteFromHere() {
      lastRerouteAt = Date.now();
      offRouteCount = 0;
      start = { name: 'My location', address: '', lat: lastFix.lat, lng: lastFix.lng };
      if (startMarker) { startMarker.remove(); startMarker = null; }
      speak('Rerouting.');
      getRoute();
    }

    function onFixError(err) {
      if (!riding) return;
      if (err.code === 1) {
        stopRide();
        showTrip([el('div', 'error', 'Location is blocked. Allow location for this site in your browser settings, then tap Start ride again.')]);
        return;
      }
      showRideCard([el('div', 'sub', 'GPS signal is weak. Still trying…')]);
    }

    function arrived() {
      const place = end ? end.name : 'your destination';
      stopRide();
      shownCoords = [];
      drawRoute();
      const done = el('button', 'btn-go', 'Done');
      done.addEventListener('click', clearRoute);
      const row = el('div', 'row');
      row.append(done);
      showCard([el('div', 'summary', 'You have arrived'), el('div', 'sub', place), row]);
      speak('You have arrived' + (end ? ' at ' + niceStreet(end.name) : '') + '.');
      track('ride_arrived');
      letScreenSleep();
    }

    // Stop following when the rider drags the map; "Re-centre" brings it back
    map.on('dragstart', () => {
      if (riding && following) { following = false; showRideCard(); }
    });

    function recentre() {
      following = true;
      if (lastFix) map.easeTo(Object.assign(followView([lastFix.lng, lastFix.lat], lastFix.heading, lastFix.speedKmh), { duration: 600 }));
      showRideCard();
    }

    function arrivalClock(seconds) {
      const t = new Date(Date.now() + seconds * 1000);
      return t.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    }

    // While riding: the next turn sits at the top; the bottom is one slim bar
    // (distance and time left, arrival time, Send ETA, voice, End). The map gets the rest.
    function showRideCard(extra = []) {
      if (!riding) return;

      turnBox.hidden = !progress;
      turnBox.innerHTML = '';
      if (progress) turnBox.append(nextTurnBanner());
      if (picked) return;   // a place card is open (choosing a new destination): leave it there

      const parts = [...extra];
      if (progress && progress.offRoute_m > 50) parts.push(el('div', 'sub off', 'You are off the route'));

      const info = el('div', 'ride-info');
      let secondsLeft = null;
      if (progress && lastRoute && routeGeo && routeGeo.total > 0) {
        // Share of the route still ahead, applied to OneMap's own distance and time
        const share = Math.min(1, progress.remaining_m / routeGeo.total);
        const metresLeft = (lastRoute.distance_m || routeGeo.total) * share;
        secondsLeft = (lastRoute.time_s || 0) * share;
        info.append(
          el('div', 'ride-left', formatDistance(Math.max(metresLeft, 1)) + ' · ' + formatTime(Math.max(secondsLeft, 60))),
          el('div', 'sub', 'Arrive ' + arrivalClock(secondsLeft) + (end ? ' · ' + end.name : '')));
      } else {
        info.append(el('div', 'ride-left', end ? end.name : 'Riding'));
      }

      const bar = el('div', 'ride-bar');
      bar.append(info);
      if (secondsLeft != null) {
        const share = el('button', 'ride-btn btn-share-eta', '💬');
        share.type = 'button';
        share.setAttribute('aria-label', 'Send ETA to customer');
        share.addEventListener('click', () => shareEta(secondsLeft));
        bar.append(share);
      }
      const voice = el('button', 'ride-btn btn-voice', voiceOn ? '🔊' : '🔇');
      voice.type = 'button';
      voice.setAttribute('aria-label', voiceOn ? 'Turn voice directions off' : 'Turn voice directions on');
      voice.addEventListener('click', toggleVoice);
      const stop = el('button', 'ride-end btn-end-ride', 'End');
      stop.type = 'button';
      stop.setAttribute('aria-label', 'End ride');
      stop.addEventListener('click', endRide);
      bar.append(voice, stop);
      parts.push(bar);

      if (!following) {
        const rc = el('button', 'float-btn btn-recentre', '◎ Re-centre');
        rc.type = 'button';
        rc.addEventListener('click', recentre);
        parts.push(rc);
      }

      showCard(parts, 'ride');
    }

    // ---------- anonymous usage counts (no user, device or location) ----------
    const APP_VERSION = '2026.10.28';
    const lastTracked = {};
    function track(name) {
      if (!/^[a-z_:]{2,40}$/.test(name)) return;
      if (lastTracked[name] && Date.now() - lastTracked[name] < 30000) return; // at most twice a minute per feature
      lastTracked[name] = Date.now();
      try {
        fetch('/api/community', { method: 'POST', keepalive: true, headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ type: 'event', event: name }) }).catch(() => {});
      } catch (e) { /* counting is optional */ }
    }

    async function postCommunity(body) {
      const resp = await fetch('/api/community', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body) });
      let data = {};
      try { data = await resp.json(); } catch (e) { /* ignore */ }
      if (!resp.ok) throw new Error(data.error || ('Could not send (status ' + resp.status + ')'));
      return data;
    }

    // ---------- Share ETA with the customer ----------
    const MODE_EMOJI = { cycle: '🚲', drive: '🚗', walk: '🚶' };
    function etaButton(secondsLeft) {
      const b = el('button', 'btn-share', '💬 Send ETA to customer');
      b.type = 'button';
      b.addEventListener('click', () => shareEta(secondsLeft));
      return b;
    }
    async function shareEta(secondsLeft) {
      const text = 'Hi! I am on the way ' + MODE_EMOJI[mode] + ' Arriving about ' + arrivalClock(secondsLeft) + '.';
      track('share_eta');
      // The phone's own share menu (WhatsApp, Telegram, SMS, Copy...), or WhatsApp directly
      if (navigator.share) {
        try { await navigator.share({ text }); return; } catch (e) { if (e && e.name === 'AbortError') return; }
      }
      window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank', 'noopener');
    }

    // ---------- community: closed places and rider-added places ----------
    let community = { closed: [], missing: [] };
    async function loadCommunity() {
      try {
        const data = await getJson('/api/community');
        community = { closed: data.closed || [], missing: data.missing || [] };
        updateOverlays();
      } catch (e) { /* the app works without it */ }
    }
    function sameName(a, b) {
      const x = String(a || '').toLowerCase().replace(/[^a-z0-9]/g, ''), y = String(b || '').toLowerCase().replace(/[^a-z0-9]/g, '');
      return x && y && (x === y || x.includes(y) || y.includes(x));
    }
    function closedReports(place) {
      if (!place || place.lat == null) return 0;
      const hit = community.closed.find((c) => sameName(c.name, place.name) && metresBetween([c.lng, c.lat], [place.lng, place.lat]) < 80);
      return hit ? hit.count : 0;
    }
    function communityMatches(q) {
      const k = String(q).toLowerCase().replace(/[^a-z0-9]/g, '');
      if (k.length < 2) return [];
      return community.missing
        .filter((m) => String(m.name).toLowerCase().replace(/[^a-z0-9]/g, '').includes(k))
        .slice(0, 3)
        .map((m) => ({ name: m.name, address: [m.category, m.note].filter(Boolean).join(' · '),
                       category: 'Added by riders', lat: m.lat, lng: m.lng }));
    }

    async function reportClosed(place, button) {
      button.disabled = true;
      try {
        await postCommunity({ type: 'closed', name: place.name, lat: place.lat, lng: place.lng });
        community.closed.push({ name: place.name, lat: place.lat, lng: place.lng, count: closedReports(place) + 1 });
        button.textContent = 'Reported. Thanks for helping other riders!';
        track('report_closed');
      } catch (e) {
        button.disabled = false;
        showToast(e.message);
      }
    }

    // "Add a missing place": first put the pin on the spot, then name it
    const picker = document.getElementById('picker');
    function startAddPlace(prefillName) {
      closeSheet();
      list.innerHTML = '';
      list.dataset.quick = '';
      input.blur();
      picker.hidden = false;
      const use = el('button', 'btn-end', 'Use this spot');
      const cancel = el('button', 'btn-clear', 'Cancel');
      use.addEventListener('click', () => {
        const c = map.getCenter();
        picker.hidden = true;
        hideCard();
        openAddPlaceForm(prefillName || '', c.lat, c.lng);
      });
      cancel.addEventListener('click', () => { picker.hidden = true; hideCard(); });
      const row = el('div', 'row');
      row.append(cancel, use);
      showCard([el('div', 'place', 'Add a missing place'),
                el('div', 'sub', 'Move the map so the pin sits exactly on the place, then tap Use this spot.'), row]);
    }

    function field(labelText, control) {
      const wrap = el('label', 'field');
      wrap.append(el('span', 'field-label', labelText), control);
      return wrap;
    }

    function openAddPlaceForm(name, lat, lng) {
      openPanel('add', (panel) => {
        panel.append(el('h2', null, 'Add a missing place'));
        panel.append(el('p', 'sheet-note', 'Other riders will find it in search and on the map. Please add real places only.'));
        const nameInput = el('input');
        Object.assign(nameInput, { type: 'text', maxLength: 80, value: name, placeholder: 'e.g. Obbi Good Label' });
        const cat = el('select');
        for (const c of ['Shop', 'Food', 'Office', 'Condo or HDB gate', 'Loading bay', 'Rider waiting area', 'Other']) {
          const o = el('option', null, c); o.value = c; cat.append(o);
        }
        const note = el('textarea');
        Object.assign(note, { maxLength: 200, placeholder: 'Helpful details, e.g. #05-03, take lift B' });
        const trap = el('input');                       // hidden field only robots fill in
        Object.assign(trap, { type: 'text', name: 'website', tabIndex: -1, autocomplete: 'off' });
        trap.className = 'trap';
        const msg = el('div', 'form-msg');
        const send = el('button', 'sheet-done', 'Add place');
        send.type = 'button';
        send.addEventListener('click', async () => {
          if (!nameInput.value.trim()) { msg.textContent = 'Please give the place a name.'; return; }
          send.disabled = true;
          msg.textContent = 'Sending…';
          try {
            await postCommunity({ type: 'missing', name: nameInput.value, category: cat.value, note: note.value, lat, lng, website: trap.value });
            community.missing.unshift({ name: nameInput.value.trim(), category: cat.value, note: note.value.trim(), lat, lng, count: 1 });
            updateOverlays();
            track('add_place');
            closeSheet();
            showToast('Added. Thank you!');
          } catch (e) {
            send.disabled = false;
            msg.textContent = e.message;
          }
        });
        const cancel = el('button', 'sheet-cancel', 'Cancel');
        cancel.type = 'button';
        cancel.addEventListener('click', closeSheet);
        panel.append(field('Name', nameInput), field('Type', cat), field('Details (optional)', note), trap, msg, send, cancel);
      });
    }

    // ---------- feedback ----------
    function openFeedback() {
      openPanel('feedback', (panel) => {
        panel.append(el('h2', null, 'Send feedback'));
        panel.append(el('p', 'sheet-note', 'Tell us what works, what doesn’t, and what you’d like next. It goes straight to the team behind ' + document.title + '.'));
        const msgBox = el('textarea');
        Object.assign(msgBox, { maxLength: 2000, placeholder: 'Your feedback' });
        msgBox.classList.add('tall');
        const contact = el('input');
        Object.assign(contact, { type: 'text', maxLength: 120, placeholder: 'Telegram, phone or email (optional)' });
        const trap = el('input');
        Object.assign(trap, { type: 'text', name: 'website', tabIndex: -1, autocomplete: 'off' });
        trap.className = 'trap';
        const msg = el('div', 'form-msg');
        const send = el('button', 'sheet-done', 'Send');
        send.type = 'button';
        send.addEventListener('click', async () => {
          if (!msgBox.value.trim()) { msg.textContent = 'Please write a message.'; return; }
          send.disabled = true;
          msg.textContent = 'Sending…';
          try {
            await postCommunity({ type: 'feedback', message: msgBox.value, contact: contact.value, version: APP_VERSION, website: trap.value });
            track('feedback');
            closeSheet();
            showToast('Thanks for your feedback!');
          } catch (e) {
            send.disabled = false;
            msg.textContent = e.message;
          }
        });
        const cancel = el('button', 'sheet-cancel', 'Cancel');
        cancel.type = 'button';
        cancel.addEventListener('click', closeSheet);
        panel.append(field('Message', msgBox), field('How can we reply? (optional)', contact), trap, msg, send, cancel);
      });
    }

    // ---------- About and privacy ----------
    function openAbout() {
      openPanel('about', (panel) => {
        const name = document.title;
        panel.append(el('h2', null, 'About ' + name));
        const section = (title, lines) => {
          panel.append(el('h3', null, title));
          const box = el('div', 'group about');
          for (const l of lines) box.append(el('p', null, l));
          panel.append(box);
        };
        section('What it does', [
          name + ' is a free map for Singapore delivery riders: search places, get cycling, driving or walking routes with spoken directions, and see rain, traffic, parking, toilets and shelters.'
        ]);
        section('Your privacy', [
          'Your location stays on your phone. It is used to show where you are and guide you, and is never stored.',
          'To find places and routes, your search words, the middle of the map, and your start and end points are sent to our server and to the map services below, only to answer that request.',
          'Saved and recent places, and your settings, are kept on your phone only.',
          '"Closed for good" and "Add a missing place" store the place and its location, not who sent them.',
          'Feedback stores what you write, and a contact only if you give one.',
          'We count which features are used and how many people visit, without cookies and without identifying you.'
        ]);
        section('Data and map credits', [
          'Map data © OpenStreetMap contributors. Map tiles: OpenFreeMap, © OpenMapTiles.',
          'Addresses and routes: OneMap, © Singapore Land Authority.',
          'Traffic incidents and car park availability: LTA DataMall.',
          'Weather and heat stress: National Environment Agency, via data.gov.sg (Singapore Open Data Licence).',
          'Business search: Photon by komoot, using OpenStreetMap data.'
        ]);
        section('Contact', ['Questions or problems? Use Send feedback and leave a way to reach you.']);
        panel.append(el('p', 'sheet-note', 'Version ' + APP_VERSION));
        const fb = el('button', 'sheet-cancel', 'Send feedback');
        fb.type = 'button';
        fb.addEventListener('click', openFeedback);
        const done = el('button', 'sheet-done', 'Done');
        done.type = 'button';
        done.addEventListener('click', closeSheet);
        panel.append(done, fb);
      });
    }

    // ---------- welcome screen on first open ----------
    function showWelcome() {
      let seen = false;
      try { seen = localStorage.getItem('welcomed') === '1'; } catch (e) { seen = true; }
      if (seen) return;
      openPanel('welcome', (panel) => {
        const name = document.title;
        panel.classList.add('welcome');
        panel.append(el('h2', null, 'Welcome to ' + name));
        panel.append(el('p', 'sheet-note', 'A free map made for Singapore delivery riders.'));
        const points = el('div', 'group about');
        for (const [icon, title, text] of [
          ['🔎', 'Search anything', 'Places, postal codes, shops and food, plus places added by riders.'],
          ['🧭', 'Routes with voice', 'Cycle, drive or walk, with spoken turn-by-turn directions.'],
          ['🌧', 'Rain and heat alerts', 'Know before the rain hits, and when to drink water.'],
          ['🅿️', 'Parking and more', 'Live free lots, toilets, water and shelters on the map.']]) {
          const row = el('div', 'welcome-row');
          const words = el('div');
          words.append(el('strong', null, title), el('span', null, text));
          row.append(el('span', 'welcome-icon', icon), words);
          points.append(row);
        }
        panel.append(points);
        panel.append(el('p', 'sheet-note', 'Your location stays on your phone and is never stored. It is only used to show where you are and guide you.'));
        const finish = () => { save('welcomed', '1'); closeSheet(); };
        const allow = el('button', 'sheet-done', 'Allow location');
        allow.type = 'button';
        allow.addEventListener('click', () => {
          finish();
          if (!('geolocation' in navigator)) return;
          askCompassPermission();
          navigator.geolocation.getCurrentPosition((pos) => {
            const { latitude, longitude } = pos.coords;
            if (inSingapore(latitude, longitude)) map.flyTo({ center: [longitude, latitude], zoom: 15 });
            gotLocation(pos);
            track('welcome_location');
          }, () => showToast('You can allow location later in your browser settings.'),
          { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 });
        });
        panel.append(allow);
        if (!isInstalled() && (installPrompt || isPhone)) {
          const inst = el('button', 'sheet-cancel', 'Add to home screen');
          inst.type = 'button';
          inst.addEventListener('click', () => { finish(); onInstallClick(); });
          panel.append(inst);
        }
        const later = el('button', 'sheet-cancel', 'Not now');
        later.type = 'button';
        later.addEventListener('click', finish);
        panel.append(later);
      });
    }

    // ---------- "Install" banner: put the app on the home screen ----------
    const installBox = document.getElementById('install');
    const APP_NAME = document.title;           // follows the app name in <title>
    let installPrompt = null;                  // Android / Chrome's own install prompt, when offered

    function isInstalled() {
      return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    }
    const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent)
      || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const isPhone = isIOS || /android/i.test(navigator.userAgent);

    function installSnoozed() {
      try { return Date.now() < Number(localStorage.getItem('installHiddenUntil') || 0); } catch (e) { return false; }
    }

    function hideInstall(snoozeDays) {
      installBox.hidden = true;
      installBox.innerHTML = '';
      if (snoozeDays) save('installHiddenUntil', String(Date.now() + snoozeDays * 24 * 60 * 60 * 1000));
    }

    function closeButton(snoozeDays) {
      const close = el('button', 'install-close', '×');
      close.type = 'button';
      close.setAttribute('aria-label', 'Not now');
      close.addEventListener('click', () => hideInstall(snoozeDays));
      return close;
    }

    // Only ask once someone has found the app useful: a route found, or a second visit.
    // (The welcome screen already offers "Add to home screen" on the very first visit.)
    const visits = (() => {
      let n = 0;
      try {
        n = Number(localStorage.getItem('visits') || 0);
        if (!sessionStorage.getItem('counted')) { n++; localStorage.setItem('visits', String(n)); sessionStorage.setItem('counted', '1'); }
      } catch (e) { /* storage blocked */ }
      return n;
    })();
    function engaged() {
      try { return visits >= 2 || Number(localStorage.getItem('routesFound') || 0) >= 1; } catch (e) { return true; }
    }
    function noteRouteDone() {
      try { localStorage.setItem('routesFound', String(Number(localStorage.getItem('routesFound') || 0) + 1)); } catch (e) { /* ignore */ }
      if (installBox.hidden && (installPrompt || isPhone)) showInstall();
    }

    function showInstall() {
      if (isInstalled() || installSnoozed() || !engaged()) return;
      installBox.innerHTML = '';
      const text = el('div', 'install-text');
      text.append(el('strong', null, 'Get ' + APP_NAME + ' — free'));
      const btn = el('button', 'install-btn', 'Install');
      btn.type = 'button';
      btn.addEventListener('click', onInstallClick);
      installBox.append(text, btn, closeButton(7));
      installBox.hidden = false;
    }

    async function onInstallClick() {
      if (installPrompt) {
        const prompt = installPrompt;
        installPrompt = null;               // the phone allows each prompt to be used once
        prompt.prompt();
        try {
          const choice = await prompt.userChoice;
          if (choice && choice.outcome === 'accepted') { hideInstall(); track('install'); }
        } catch (e) { /* ignore */ }
        return;
      }
      showInstallSteps();
    }

    // iPhones (and browsers without a one-tap prompt): show the steps instead
    function showInstallSteps() {
      const steps = isIOS
        ? ['Tap the Share button (square with an arrow) at the bottom of Safari.',
           'Scroll down and tap “Add to Home Screen”.',
           'Tap “Add”.']
        : ['Tap the browser menu ⋮ (top or bottom right).',
           'Tap “Install app” or “Add to Home screen”.',
           'Tap “Install” or “Add” to confirm.'];
      installBox.innerHTML = '';
      const text = el('div', 'install-text');
      text.append(el('strong', null, 'Add ' + APP_NAME + ' to your home screen'));
      const list = el('ol', 'install-steps');
      steps.forEach((s) => list.appendChild(el('li', null, s)));
      const ok = el('button', 'install-btn', 'Got it');
      ok.type = 'button';
      ok.addEventListener('click', () => hideInstall(30));
      installBox.append(text, closeButton(7), list, ok);
      installBox.hidden = false;
    }

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();                   // show our own button instead of the browser's mini bar
      installPrompt = e;
      showInstall();
    });

    window.addEventListener('appinstalled', () => {
      installPrompt = null;
      hideInstall();
      showToast(APP_NAME + ' is on your home screen');
    });

    // Phones that never offer a one-tap prompt (iPhone, some browsers): still offer the button
    setTimeout(() => { if (!installPrompt && isPhone && installBox.hidden) showInstall(); }, 3000);

    updateTop();   // shortcut chips for saved and recent places

    // ---------- install as an app ----------
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => { /* app still works without it */ });
      });
    }
  </script>
</body>
</html>
