<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b5fff" />
  <title>Rider Map SG</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@^6.15.0/dist/maplibre-gl.css" />
  <style>
    html, body { margin: 0; height: 100%; }
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    #map { position: fixed; inset: 0; }

    /* Search bar */
    .search {
      position: fixed; left: 12px; right: 12px;
      top: calc(env(safe-area-inset-top, 0px) + 12px);
      z-index: 5;
    }
    .search-box {
      display: flex; align-items: center; gap: 8px;
      background: #fff; border-radius: 12px;
      padding: 4px 6px 4px 14px;
      box-shadow: 0 2px 10px rgba(0,0,0,.25);
    }
    .search-box input {
      flex: 1; min-width: 0; border: 0; outline: none;
      font-size: 17px; /* 16px+ stops iPhone zooming in */
      padding: 10px 0; background: transparent; color: #111;
    }
    .search-box button {
      border: 0; background: #eef1f5; color: #333;
      width: 40px; height: 40px; border-radius: 10px;
      font-size: 20px; cursor: pointer;
    }
    .results {
      list-style: none; margin: 8px 0 0; padding: 0;
      background: #fff; border-radius: 12px;
      box-shadow: 0 2px 10px rgba(0,0,0,.25);
      max-height: 55vh; overflow-y: auto;
    }
    .results:empty { display: none; }
    .results li { padding: 12px 14px; border-bottom: 1px solid #eee; cursor: pointer; }
    .results li:last-child { border-bottom: 0; }
    .results li:active { background: #f2f5fa; }
    .results .name { font-weight: 600; font-size: 15px; color: #111; }
    .results .addr { font-size: 13px; color: #555; margin-top: 2px; }
    .results .msg { color: #555; cursor: default; }

    /* Floating "start from my location" button */
    .locate {
      position: fixed; left: 12px;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 24px);
      z-index: 4; border: 0; border-radius: 24px;
      background: #fff; color: #0b5fff;
      padding: 12px 16px; font-size: 15px; font-weight: 600;
      box-shadow: 0 2px 10px rgba(0,0,0,.25); cursor: pointer;
    }
    .locate[hidden] { display: none; }

    /* Bottom card */
    .card {
      position: fixed; left: 12px; right: 12px;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
      background: #fff; border-radius: 14px; padding: 14px;
      box-shadow: 0 2px 12px rgba(0,0,0,.3); z-index: 5; color: #111;
    }
    .card[hidden] { display: none; }
    .card .place { font-weight: 600; font-size: 16px; }
    .card .sub { font-size: 13px; color: #555; margin-top: 2px; }
    .card .row { display: flex; gap: 8px; margin-top: 12px; }
    .card button {
      flex: 1; border: 0; border-radius: 10px; padding: 13px 10px;
      font-size: 16px; font-weight: 600; cursor: pointer;
    }
    .btn-start { background: #e5f4e4; color: #1b6b1b; }
    .btn-end   { background: #fbebeb; color: #a11d1d; }
    .btn-clear { background: #eef1f5; color: #333; }
    .btn-me    { background: #e7f1fb; color: #0b5fff; }

    /* Cycle / Drive / Walk switch */
    .modes {
      display: flex; background: #eef1f5; border-radius: 10px; padding: 3px; gap: 3px;
      margin-bottom: 10px;
    }
    .card .modes button {
      padding: 10px 4px; font-size: 15px; background: transparent; color: #444;
    }
    .card .modes button.on { background: #fff; color: #0b5fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); }

    .trip { font-size: 14px; line-height: 1.5; }
    .trip .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
    .summary { font-size: 22px; font-weight: 700; margin-top: 8px; }
    .summary small { font-size: 14px; font-weight: 500; color: #555; }
    .error { color: #a11d1d; font-size: 14px; margin-top: 8px; }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="search">
    <div class="search-box">
      <input id="q" type="search" placeholder="Search a place, block or postal code"
             autocomplete="off" enterkeyhint="search" aria-label="Search places" />
      <button id="clear" type="button" aria-label="Clear search">×</button>
    </div>
    <ul id="results" class="results"></ul>
  </div>

  <button id="locate" class="locate" type="button">◎ Start from my location</button>

  <div id="card" class="card" hidden></div>

  <script type="module">
    import * as maplibregl from 'https://unpkg.com/maplibre-gl@^6.15.0/dist/maplibre-gl.mjs';

    const START_COLOUR = '#1b9e3e';
    const END_COLOUR = '#d62828';

    const MODES = {
      cycle: { label: 'Cycle', words: 'by bicycle', colour: '#0b5fff' },
      drive: { label: 'Drive', words: 'by car',     colour: '#7a3cff' },
      walk:  { label: 'Walk',  words: 'on foot',    colour: '#0a8a7a' }
    };

    // Remember the last travel mode on this phone (falls back to Cycle)
    let mode = 'cycle';
    try {
      const saved = localStorage.getItem('mode');
      if (MODES[saved]) mode = saved;
    } catch (e) { /* storage blocked: keep default */ }

    // Centre of Singapore (longitude, latitude)
    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://tiles.openfreemap.org/styles/liberty',
      center: [103.8198, 1.3521],
      zoom: 11.2,
      maxBounds: [[103.55, 1.12], [104.15, 1.50]]
    });
    map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'bottom-right');

    // Empty route line, filled in when a route arrives
    map.on('load', () => {
      map.addSource('route', { type: 'geojson', data: emptyLine() });
      map.addLayer({ id: 'route-casing', type: 'line', source: 'route',
        layout: { 'line-cap': 'round', 'line-join': 'round' },
        paint: { 'line-color': '#ffffff', 'line-width': 10 } });
      map.addLayer({ id: 'route-line', type: 'line', source: 'route',
        layout: { 'line-cap': 'round', 'line-join': 'round' },
        paint: { 'line-color': MODES[mode].colour, 'line-width': 6 } });
    });

    function emptyLine() {
      return { type: 'Feature', geometry: { type: 'LineString', coordinates: [] } };
    }

    const input = document.getElementById('q');
    const list = document.getElementById('results');
    const clearBtn = document.getElementById('clear');
    const card = document.getElementById('card');
    const locateBtn = document.getElementById('locate');

    let picked = null;       // place chosen from search, waiting for Start/Go
    let pickedMarker = null;
    let start = null, end = null;
    let startMarker = null, endMarker = null;
    let timer = null;
    let lastQuery = '';
    let routeRequest = 0;    // ignores answers to older route requests
    let lastRoute = null;    // last successful route

    // ---------- helpers ----------
    function el(tag, className, text) {
      const e = document.createElement(tag);
      if (className) e.className = className;
      if (text != null) e.textContent = text;
      return e;
    }

    function formatDistance(m) {
      if (!m) return '';
      return m < 1000 ? Math.round(m) + ' m' : (m / 1000).toFixed(1) + ' km';
    }

    function formatTime(s) {
      if (!s) return '';
      const mins = Math.max(1, Math.round(s / 60));
      if (mins < 60) return mins + ' min';
      return Math.floor(mins / 60) + ' h ' + (mins % 60) + ' min';
    }

    function inSingapore(lat, lng) {
      return lat > 1.1 && lat < 1.5 && lng > 103.5 && lng < 104.2;
    }

    // Fetch JSON, turning non-JSON replies into a readable error
    async function getJson(url) {
      const resp = await fetch(url);
      let data;
      try {
        data = await resp.json();
      } catch (e) {
        throw new Error('The service replied with status ' + resp.status + '.');
      }
      if (data.error) throw new Error(data.error);
      return data;
    }

    // Keep the +/- buttons above the card
    function liftControls() {
      const ctrl = document.querySelector('.maplibregl-ctrl-bottom-right');
      if (!ctrl) return;
      ctrl.style.bottom = card.hidden ? '' : (card.offsetHeight + 12) + 'px';
    }

    function showCard(children) {
      card.innerHTML = '';
      children.forEach((c) => card.appendChild(c));
      card.hidden = false;
      locateBtn.hidden = true;
      liftControls();
    }

    function hideCard() {
      card.hidden = true;
      card.innerHTML = '';
      locateBtn.hidden = false;
      liftControls();
    }

    // ---------- search ----------
    function showMessage(text) {
      list.innerHTML = '';
      list.appendChild(el('li', 'msg', text));
    }

    function showResults(results) {
      list.innerHTML = '';
      if (!results.length) { showMessage('No places found'); return; }
      for (const r of results) {
        const li = el('li');
        li.append(el('div', 'name', r.name), el('div', 'addr', r.address));
        li.addEventListener('click', () => choose(r));
        list.appendChild(li);
      }
    }

    async function search(q) {
      lastQuery = q;
      showMessage('Searching…');
      try {
        const data = await getJson('/api/search?q=' + encodeURIComponent(q));
        if (q !== lastQuery) return;
        showResults(data.results || []);
      } catch (e) {
        if (q === lastQuery) showMessage('Search problem: ' + e.message);
      }
    }

    input.addEventListener('input', () => {
      clearTimeout(timer);
      const q = input.value.trim();
      if (q.length < 2) { list.innerHTML = ''; lastQuery = ''; return; }
      timer = setTimeout(() => search(q), 400);
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        clearTimeout(timer);
        const q = input.value.trim();
        if (q.length >= 2) search(q);
      }
    });

    clearBtn.addEventListener('click', () => {
      input.value = '';
      list.innerHTML = '';
      lastQuery = '';
      input.focus();
    });

    // ---------- choosing a place ----------
    function choose(r) {
      list.innerHTML = '';
      input.value = '';
      input.blur(); // hide the phone keyboard
      picked = r;
      if (pickedMarker) pickedMarker.remove();
      pickedMarker = new maplibregl.Marker({ color: '#0b5fff' }).setLngLat([r.lng, r.lat]).addTo(map);
      map.flyTo({ center: [r.lng, r.lat], zoom: 16 });

      const startBtn = el('button', 'btn-start', 'Start here');
      const endBtn = el('button', 'btn-end', 'Go here');
      startBtn.addEventListener('click', () => setPoint('start', picked));
      endBtn.addEventListener('click', () => setPoint('end', picked));
      const row = el('div', 'row');
      row.append(startBtn, endBtn);
      showCard([el('div', 'place', r.name), el('div', 'sub', r.address), row]);
    }

    function setPoint(which, place) {
      if (!place) return;
      if (pickedMarker) { pickedMarker.remove(); pickedMarker = null; }
      picked = null;
      const lngLat = [place.lng, place.lat];
      if (which === 'start') {
        start = place;
        if (startMarker) startMarker.remove();
        startMarker = new maplibregl.Marker({ color: START_COLOUR }).setLngLat(lngLat).addTo(map);
      } else {
        end = place;
        if (endMarker) endMarker.remove();
        endMarker = new maplibregl.Marker({ color: END_COLOUR }).setLngLat(lngLat).addTo(map);
      }
      if (start && end) {
        getRoute();
      } else {
        if (!end) map.flyTo({ center: lngLat, zoom: 15 });
        showTrip();
      }
    }

    // ---------- my location ----------
    function useMyLocation() {
      if (!('geolocation' in navigator)) {
        showTrip([el('div', 'error', 'This browser cannot share your location.')]);
        return;
      }
      showTrip([el('div', 'sub', 'Finding your location…')]);
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;
          if (!inSingapore(lat, lng)) {
            showTrip([el('div', 'error', 'Your location seems to be outside Singapore.')]);
            return;
          }
          setPoint('start', { name: 'My location', address: '', lat, lng });
        },
        (err) => {
          const msg = err.code === 1
            ? 'Location is blocked. Allow location for this site in your browser settings, then try again.'
            : 'Could not get your location. Check that location is on, then try again.';
          showTrip([el('div', 'error', msg)]);
        },
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 30000 }
      );
    }

    locateBtn.addEventListener('click', useMyLocation);

    // ---------- trip card ----------
    function tripLine(colour, label, place) {
      const line = el('div');
      const dot = el('span', 'dot');
      dot.style.background = colour;
      line.append(dot, document.createTextNode(label + ': ' + (place ? place.name : 'search for a place')));
      return line;
    }

    function modeSwitch() {
      const wrap = el('div', 'modes');
      for (const key of Object.keys(MODES)) {
        const b = el('button', key === mode ? 'on' : '', MODES[key].label);
        b.type = 'button';
        b.addEventListener('click', () => setMode(key));
        wrap.appendChild(b);
      }
      return wrap;
    }

    function setMode(key) {
      if (key === mode) return;
      mode = key;
      try { localStorage.setItem('mode', mode); } catch (e) { /* ignore */ }
      if (map.getLayer('route-line')) map.setPaintProperty('route-line', 'line-color', MODES[mode].colour);
      if (start && end) getRoute(); else showTrip();
    }

    function showTrip(extra = []) {
      const trip = el('div', 'trip');
      trip.append(tripLine(START_COLOUR, 'From', start), tripLine(END_COLOUR, 'To', end));

      const row = el('div', 'row');
      if (!start || start.name !== 'My location') {
        const me = el('button', 'btn-me', 'Start from my location');
        me.addEventListener('click', useMyLocation);
        row.append(me);
      }
      const clear = el('button', 'btn-clear', 'Clear');
      clear.addEventListener('click', clearRoute);
      row.append(clear);

      showCard([modeSwitch(), trip, ...extra, row]);
    }

    function clearRoute() {
      routeRequest++;
      start = end = picked = lastRoute = null;
      [startMarker, endMarker, pickedMarker].forEach((m) => m && m.remove());
      startMarker = endMarker = pickedMarker = null;
      const src = map.getSource('route');
      if (src) src.setData(emptyLine());
      hideCard();
    }

    // ---------- routing ----------
    async function getRoute() {
      const myRequest = ++routeRequest;
      const m = MODES[mode];
      showTrip([el('div', 'sub', 'Finding a route ' + m.words + '…')]);
      const url = '/api/route?type=' + mode
        + '&start=' + start.lat + ',' + start.lng
        + '&end=' + end.lat + ',' + end.lng;
      try {
        const data = await getJson(url);
        if (myRequest !== routeRequest) return; // user changed something meanwhile

        lastRoute = data;
        const src = map.getSource('route');
        if (src) src.setData({ type: 'Feature', geometry: { type: 'LineString', coordinates: data.coordinates } });

        const bounds = data.coordinates.reduce(
          (b, c) => b.extend(c), new maplibregl.LngLatBounds(data.coordinates[0], data.coordinates[0]));
        map.fitBounds(bounds, { padding: { top: 90, bottom: 260, left: 40, right: 40 }, maxZoom: 17 });

        const summary = el('div', 'summary');
        summary.append(
          document.createTextNode(formatDistance(data.distance_m)),
          el('small', null, '  ·  ' + formatTime(data.time_s) + ' ' + m.words));
        showTrip([summary]);
      } catch (e) {
        if (myRequest !== routeRequest) return;
        const src = map.getSource('route');
        if (src) src.setData(emptyLine());
        showTrip([el('div', 'error', 'Route problem: ' + e.message)]);
      }
    }
  </script>
</body>
</html>
